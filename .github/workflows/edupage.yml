name: EduPage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        type: choice
        options: [sync, keepalive, auth-check]
        default: sync
      slot:
        description: RAW collection slot
        type: choice
        options: [main, early, morning, noon]
        default: main
  schedule:
    - cron: '0 9 * * *'
      timezone: Europe/Bratislava
    - cron: '0 12 * * *'
      timezone: Europe/Bratislava
    - cron: '0 16 * * *'
      timezone: Europe/Bratislava
    - cron: '0 18 * * *'
      timezone: Europe/Bratislava
    - cron: '20 18 * * *'
      timezone: Europe/Bratislava

permissions:
  contents: read

concurrency:
  group: edupage-state
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.EDUPAGE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.schedule != '17 * * * *')
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Offline checks without credentials
        run: python -m unittest discover -v
      - name: Collect privately
        env:
          EDUPAGE_CONFIG_JSON: ${{ secrets.EDUPAGE_CONFIG_JSON }}
          EDUPAGE_ACCOUNT_1_USERNAME: ${{ secrets.EDUPAGE_ACCOUNT_1_USERNAME }}
          EDUPAGE_ACCOUNT_1_PASSWORD: ${{ secrets.EDUPAGE_ACCOUNT_1_PASSWORD }}
          EDUPAGE_ACCOUNT_2_USERNAME: ${{ secrets.EDUPAGE_ACCOUNT_2_USERNAME }}
          EDUPAGE_ACCOUNT_2_PASSWORD: ${{ secrets.EDUPAGE_ACCOUNT_2_PASSWORD }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EDUPAGE_FORCE_IPV4: '1'
          SCHEDULE: ${{ github.event.schedule }}
          REQUEST_MODE: ${{ inputs.mode }}
          REQUEST_SLOT: ${{ inputs.slot }}
        shell: bash
        run: |
          if [ "$SCHEDULE" = '20 18 * * *' ]; then
            EDUPAGE_RETRY_IF_MAIN_MISSING=1 EDUPAGE_RUN_SLOT=main python run.py sync
          elif [ "$REQUEST_MODE" = 'auth-check' ]; then
            python run.py auth-check
          elif [ "$SCHEDULE" = '17 * * * *' ] || [ "$REQUEST_MODE" = 'keepalive' ]; then
            python run.py keepalive
          elif [ "$SCHEDULE" = '0 9 * * *' ] || [ "$REQUEST_SLOT" = 'morning' ]; then
            EDUPAGE_RUN_SLOT=morning python run.py sync
          elif [ "$SCHEDULE" = '0 12 * * *' ] || [ "$REQUEST_SLOT" = 'noon' ]; then
            EDUPAGE_RUN_SLOT=noon python run.py sync
          elif [ "$SCHEDULE" = '0 16 * * *' ] || [ "$REQUEST_SLOT" = 'early' ]; then
            EDUPAGE_RUN_SLOT=early python run.py sync
          else
            EDUPAGE_RUN_SLOT=main python run.py sync
          fi

      - name: Alert if evening recovery fails
        if: ${{ failure() && github.event_name == 'schedule' && github.event.schedule == '20 18 * * *' }}
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from datetime import datetime
          from zoneinfo import ZoneInfo

          address = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"].replace(" ", "")
          message = EmailMessage()
          message["From"] = address
          message["To"] = address
          message["Subject"] = "[EduPage] Večerný MAIN stále chýba"
          timestamp = datetime.now(ZoneInfo("Europe/Bratislava")).strftime("%d.%m.%Y %H:%M")
          message.set_content(
              f"Poistný zber EduPage o 18:20 ({timestamp}) zlyhal. "
              "Dnešný úspešný MAIN RAW pre obe školy sa nepodarilo potvrdiť. "
              "Skontroluj GitHub Actions beh 'EduPage' a prípadne spusti "
              "manuálny sync s mode=sync a slot=main."
          )
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(address, password)
              smtp.send_message(message)
          PY
